# ---------------------------------------------------------------------------
# Netlify раздаёт только статические файлы, поэтому здесь собирается
# ТОЛЬКО витрина сайта: тексты, каталог, продукты, галереи, языки.
#
# Чат, форма заявок, админ-панель и кабинет оператора работать не будут —
# им нужен запущенный Node-сервер, которого на Netlify нет.
# Если нужны и они, разворачивайте всё на Render (см. render.yaml).
# ---------------------------------------------------------------------------

[build]
  command = "npx vite build --config vite.site.config.js && node scripts/seo.js"
  publish = "apps/site/dist"

[build.environment]
  NODE_VERSION = "20"
  # Адрес прописывается в Site settings → Environment variables:
  #   SITE_URL  — ваш домен, попадает в OG-теги и sitemap
  #   OG_IMAGE  — картинка для превью ссылки в мессенджерах
  #   VITE_API_URL — адрес сервера, если он поднят отдельно на Render

# Маршруты у сайта хешевые (#about, #product-autosdk), но правило
# на всякий случай: любой неизвестный путь отдаёт index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Служебные разделы в поиске не нужны.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Шрифты не меняются — храним год. WebP-варианты фото — неделю, потом
# браузер проверяет их в фоне. Офлайн-кеш (sw.js) проверяется всегда.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
