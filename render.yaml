# ---------------------------------------------------------------------------
# Развёртывание всего проекта на Render одним сервисом.
#
# Сервер сам раздаёт сайт, админ-панель и кабинет оператора:
#   https://ваш-адрес.onrender.com/           сайт
#   https://ваш-адрес.onrender.com/admin/     админ-панель
#   https://ваш-адрес.onrender.com/operator/  кабинет
#
# Постоянный диск обязателен: без него переписка, созданные сотрудники,
# загруженные картинки и правки контента пропадут при первом же деплое.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: olan
    runtime: node
    plan: starter          # бесплатный план засыпает и не даёт диск
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    disk:
      name: olan-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20"
      # PORT не задаём: Render подставляет его сам, а сервер читает
      # process.env.PORT. Если прописать своё значение, оно перебьёт
      # то, что ждёт платформа, и сервис может не подняться.

      # Рабочие данные на постоянном диске
      - key: DATA_DIR
        value: /var/data/server
      - key: SITE_DATA_FILE
        value: /var/data/content/siteData.js
      - key: UPLOAD_DIR
        value: /var/data/uploads

      # Пароль администратора задайте вручную в панели Render
      - key: ADMIN_USER
        value: user
      - key: ADMIN_KEY
        sync: false

      # Адрес сайта для OG-тегов и sitemap
      - key: SITE_URL
        sync: false

      # Ключ переводчика. Без него Render часто получает от бесплатного
      # эндпоинта Google ответ 403, и автоперевод не работает.
      # Заводится в Google Cloud Console (Cloud Translation API).
      #   TRANSLATE_API_KEY

      # ---------------------------------------------------------------
      # Возврат правок в исходный код (необязательно).
      #
      # На хостинге контент живёт на диске, а репозиторий остаётся со
      # старым текстом. Чтобы правки из админки уходили и в GitHub,
      # добавьте в панели Render (раздел Environment) три переменные:
      #
      #   GITHUB_TOKEN   токен с правом записи (Contents: Read and write)
      #   GITHUB_REPO    владелец/репозиторий, например user/olan
      #   GITHUB_BRANCH  ветка, по умолчанию main
      #
      # Здесь их не прописываем: токен — секрет, ему не место в файле,
      # который лежит в репозитории.
      # ---------------------------------------------------------------
