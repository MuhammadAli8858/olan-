<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLAN HIGH TECH</title>
    <meta name="description" content="OLAN HIGH TECH — интеллектуальные комплексы фиксации нарушений ПДД, видеоаналитика, городские платформы и интерактивные решения. Разработка и производство в Узбекистане." />
    <meta name="theme-color" content="#0c0e13" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <link rel="preload" href="/fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Тема ставится до отрисовки, иначе у посетителя с тёмной системной
      // темой на мгновение мелькнёт белый экран.
      (function () {
        try {
          var saved = localStorage.getItem('olan-theme-choice');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* не критично */ }
      })();
    </script>
    <style>
      /* Заставка до загрузки скриптов: на медленном интернете человек сразу
         видит сайт, а не белый экран. React заменит её при первой отрисовке. */
      .o-shell{position:fixed;inset:0;overflow:hidden;background:#07090d;color:#fff;font:600 17px/1.2 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
      .o-shell__bg{position:absolute;inset:-48px;background:#07090d __OLAN_SHELL_BG__ center/cover no-repeat;filter:blur(26px);opacity:.6;transform:scale(1.08)}
      .o-shell__shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,10,.82),rgba(5,7,10,.2) 70%),linear-gradient(0deg,rgba(5,7,10,.88),rgba(5,7,10,0) 55%)}
      .o-shell__bar{position:absolute;top:0;left:0;right:0;height:72px;display:flex;align-items:center;gap:10px;padding:0 clamp(16px,4vw,48px)}
      .o-shell__line{position:absolute;left:0;right:0;bottom:0;height:2px;overflow:hidden}
      .o-shell__line::after{content:'';position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#3b82f6,transparent);animation:o-shell 1.3s ease-in-out infinite}
      @keyframes o-shell{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){.o-shell__line::after{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="o-shell" aria-hidden="true"><div class="o-shell__bg"></div><div class="o-shell__shade"></div><div class="o-shell__bar"><img src="/logo-mark.webp" alt="" width="38" height="38" />OLAN HIGH TECH</div><div class="o-shell__line"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
