<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLAN HIGH TECH</title>
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <script>
      // Тема ставится до отрисовки, иначе у посетителя с тёмной системной
      // темой на мгновение мелькнёт белый экран.
      (function () {
        try {
          var saved = localStorage.getItem('olan-theme-choice');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* не критично */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
